<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta y Auditoría por Fecha de Ingreso - Estación de Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; margin-bottom: 20px; }
        @media print {
            body { background-color: #fff; }
            .no-print { display: none !important; }
            .card { box-shadow: none; border: none; }
        }
    </style>
</head>
<body>
<div class="container my-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">MÓDULO DE CONSULTA Y AUDITORÍA</h2>
        <p class="text-muted">Consolidado diario por Fecha de Ingreso del Sistema</p>
    </div>

    <!-- BOTÓN PARA REGRESAR AL MÓDULO DE REGISTRO -->
    <div class="mb-4 no-print text-center">
        <a href="index.html" class="btn btn-outline-primary">← Ir al Módulo de Registro (Arqueos)</a>
    </div>

    <!-- FILTRO DE BÚSQUEDA -->
    <div class="card p-4 bg-white border no-print">
        <h5 class="text-secondary border-bottom pb-2">🔍 Consultar Reportes por Fecha de Ingreso</h5>
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="filtroFechaIngreso" class="form-label">Seleccione Fecha de Ingreso</label>
                <input type="date" class="form-control" id="filtroFechaIngreso">
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-dark w-100" onclick="consultarPorFechaIngreso()">📊 Generar Reporte</button>
            </div>
        </div>
    </div>

    <!-- RESULTADOS Y TABLA DE AUDITORÍA -->
    <div class="card p-4 bg-white border">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
            <h5 class="text-secondary m-0">📋 Detalle de Consignaciones y Valores</h5>
            <button class="btn btn-success btn-sm no-print" onclick="abrirVentanaImpresion()">🖨️ Imprimir / Ventana Independiente</button>
        </div>
        <div id="resultadoFiltro">
            <p class="text-muted text-center py-4">Seleccione una fecha de ingreso y haga clic en "Generar Reporte" para ver los datos.</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('filtroFechaIngreso').valueAsDate = new Date();
        consultarPorFechaIngreso();
    });

    function consultarPorFechaIngreso() {
        const fechaIngreso = document.getElementById('filtroFechaIngreso').value;
        if (!fechaIngreso) {
            alert('Por favor seleccione una fecha de ingreso.');
            return;
        }

        const divResultado = document.getElementById('resultadoFiltro');
        divResultado.innerHTML = `<div class="text-info text-center py-3">Consultando registros para la fecha de ingreso ${fechaIngreso}...</div>`;

        // URL DE GOOGLE APPS SCRIPT INTEGRADA PARA CONSULTAS
        const urlGoogleScript = "https://script.google.com/macros/s/AKfycbyWT_W9qpzz36mrLcH8lSvWpBYb6UNWgmitZPo94pnFiMmqkfT6AKXu2Xg0MAgwYEJd/exec?fecha=" + fechaIngreso;

        fetch(urlGoogleScript)
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    divResultado.innerHTML = `<div class="alert alert-warning text-center mt-3">No se encontraron registros ingresados en la fecha: ${fechaIngreso}</div>`;
                    return;
                }

                let html = `
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped table-sm align-middle">
                            <thead class="table-dark text-center">
                                <tr>
                                    <th>Nombre del Responsable</th>
                                    <th>Fecha de Reporte</th>
                                    <th>Tipo</th>
                                    <th>Efectivo (Billetes + Monedas)</th>
                                    <th>Créditos / Vales</th>
                                    <th>Datáfono</th>
                                    <th>Aditivos</th>
                                    <th>Estado / Cuadre</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.forEach(row => {
                    let totalEfectivo = Number(row.totalDinero) || 0;
                    let dif = Number(row.diferencia) || 0;
                    let estadoBadge = dif === 0 ? '<span class="badge bg-success">Cuadrado</span>' : `<span class="badge bg-danger">Descuadrado ($${dif.toLocaleString('es-CO')})</span>`;

                    html += `
                        <tr>
                            <td class="fw-bold">${row.nombre}</td>
                            <td class="text-center">${row.fechaReporte}</td>
                            <td class="text-center text-uppercase">${row.tipo}</td>
                            <td class="text-end text-success fw-bold">$ ${totalEfectivo.toLocaleString('es-CO')}</td>
                            <td class="text-end">$ ${Number(row.totalCreditos).toLocaleString('es-CO')}</td>
                            <td class="text-end">$ ${Number(row.totalDatafono).toLocaleString('es-CO')}</td>
                            <td class="text-end">$ ${Number(row.totalAditivos).toLocaleString('es-CO')}</td>
                            <td class="text-center">${estadoBadge}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                divResultado.innerHTML = html;
            })
            .catch(err => {
                divResultado.innerHTML = `<div class="alert alert-danger text-center mt-3">Error al consultar los datos: ${err}</div>`;
            });
    }

    function abrirVentanaImpresion() {
        const contenido = document.getElementById('resultadoFiltro').innerHTML;
        const fechaIngreso = document.getElementById('filtroFechaIngreso').value;
        const ventana = window.open('', '_blank', 'width=1000,height=700');
        ventana.document.write(`
            <html>
                <head>
                    <title>Reporte y Auditoría - Fecha de Ingreso: ${fechaIngreso}</title>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                </head>
                <body class="p-4">
                    <h3 class="text-center text-primary">Consolidado y Auditoría por Fecha de Ingreso</h3>
                    <h5 class="text-center text-muted mb-4">Fecha de Ingreso al Sistema: ${fechaIngreso}</h5>
                    <hr>
                    ${contenido}
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
            </html>
        `);
        ventana.document.close();
    }
</script>
</body>
</html>
